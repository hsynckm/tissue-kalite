<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tissue Kalite Kontrol - Görsel Hata Teşhis ve Müdahale Rehberi</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --success: #22c55e;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.6rem; margin-bottom: 6px; }
    .status-badge {
      display: inline-block; padding: 4px 12px; border-radius: 999px;
      font-size: 0.85rem; background: #334155; color: #fbbf24; font-weight: 600;
    }
    .status-badge.ready { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 20px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card h2 { font-size: 1.05rem; color: var(--accent); margin-bottom: 14px; }
    .upload-box {
      border: 2px dashed var(--border); border-radius: 10px; padding: 24px;
      text-align: center; cursor: pointer; transition: 0.2s; background: rgba(15, 23, 42, 0.5);
      display: block;
    }
    .upload-box:hover { border-color: var(--primary); }
    .upload-box input { display: none; }
    #previewImg { max-width: 100%; max-height: 320px; margin: 14px auto 0; border-radius: 8px; display: none; border: 1px solid var(--border); }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; }
    button {
      flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1rem;
      font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    #analyzeBtn { background: var(--primary); color: #fff; }
    #analyzeBtn:hover { background: var(--primary-hover); }
    #clearBtn { background: #334155; color: var(--text); flex: 0.45; }
    #clearBtn:hover { background: #475569; }
    .top-result {
      background: rgba(249, 115, 22, 0.12); border: 1px solid var(--primary);
      padding: 14px; border-radius: 8px; margin-bottom: 16px; font-weight: 700; font-size: 1.1rem;
    }
    .bar-row { margin-bottom: 10px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; }
    .bar-bg { background: #0f172a; height: 10px; border-radius: 6px; overflow: hidden; }
    .bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.4s ease; }
    .bar-fill.winner { background: var(--primary); }
    label.select-label { display: block; font-size: 0.9rem; color: var(--muted); margin: 18px 0 6px; }
    select {
      width: 100%; padding: 10px; border-radius: 8px; background: #0f172a;
      color: var(--text); border: 1px solid var(--border); font-size: 0.95rem;
    }
    .guide-box {
      margin-top: 12px; background: #0f172a; border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; min-height: 150px; white-space: pre-wrap; font-size: 0.95rem;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Tissue Kalite Kontrol - Görsel Hata Teşhis Sistemi</h1>
    <span id="engineStatus" class="status-badge">Referans fotoğraflar ve rehberler yükleniyor...</span>
  </header>

  <div class="grid">
    <div class="card">
      <h2>1. Test Edilecek Hatalı Kağıt Fotoğrafı</h2>
      <label class="upload-box" for="fileInput">
        <div>📷 Fotoğraf seçmek veya kamera ile çekmek için dokunun</div>
        <div style="font-size: 0.82rem; color: var(--muted); margin-top: 4px;">JPG, JPEG veya PNG</div>
        <input type="file" id="fileInput" accept="image/*" />
        <img id="previewImg" alt="Yüklenen test fotoğrafı" />
      </label>
      <div class="btn-row">
        <button id="analyzeBtn" type="button">Analiz Et</button>
        <button id="clearBtn" type="button">Temizle</button>
      </div>
    </div>

    <div class="card">
      <h2>2. Analiz ve Oran Sonuçları</h2>
      <div id="topResult" class="top-result">Henüz analiz yapılmadı.</div>
      <div id="barsContainer"></div>

      <label class="select-label" for="defectSelect">
        Müdahale Rehberi Görüntülenen Sorun (Farklı ihtimal için buradan seçebilirsiniz):
      </label>
      <select id="defectSelect"></select>
      <div id="guideText" class="guide-box">Rehber yükleniyor...</div>
    </div>
  </div>
</div>

<script>
  // Her sorun için ana dosya + otomatik taranacak ek örnek isimleri (_2.jpg ... _10.jpg)
  const DEFECTS = [
    {
      id: "su_izi",
      name: "1. Sorun (su_izi)",
      prefix: "su_izi",
      baseFiles: ["1.jpg"],
      txtFiles: ["su_izi.txt"],
      guide: "su_izi.txt dosyası bulunamadı."
    },
    {
      id: "blof",
      name: "2. Sorun (blöf)",
      prefix: "blof",
      baseFiles: ["7.jpeg.jpg"],
      txtFiles: ["blof.txt", "blöf.txt"],
      guide: "blof.txt dosyası bulunamadı."
    },
    {
      id: "boyuna_iz",
      name: "3. Sorun (boyuna_iz)",
      prefix: "boyuna_iz",
      baseFiles: ["9.jpg"],
      txtFiles: ["boyuna_iz.txt"],
      guide: "boyuna_iz.txt dosyası bulunamadı."
    },
    {
      id: "broke_lekesi",
      name: "4. Sorun (broke_lekesi)",
      prefix: "broke_lekesi",
      baseFiles: ["3.jpg"],
      txtFiles: ["broke_lekesi.txt"],
      guide: "broke_lekesi.txt dosyası bulunamadı."
    },
    {
      id: "erime",
      name: "5. Sorun (erime)",
      prefix: "erime",
      baseFiles: ["5.jpg"],
      txtFiles: ["erime.txt"],
      guide: "erime.txt dosyası bulunamadı."
    },
    {
      id: "yigilma",
      name: "6. Sorun (yigilma)",
      prefix: "yigilma",
      baseFiles: ["2.jpg"],
      txtFiles: ["yigilma.txt", "yığılma.txt"],
      guide: "yigilma.txt dosyası bulunamadı."
    }
  ];

  // Her sorun için birden fazla referans imzası tutulur: { su_izi: [sig1, sig2, ...], ... }
  const refFeaturesMap = {};
  let imageReady = false;

  const defectSelect = document.getElementById("defectSelect");
  const guideText = document.getElementById("guideText");
  const barsContainer = document.getElementById("barsContainer");
  const fileInput = document.getElementById("fileInput");
  const previewImg = document.getElementById("previewImg");
  const analyzeBtn = document.getElementById("analyzeBtn");
  const clearBtn = document.getElementById("clearBtn");
  const topResult = document.getElementById("topResult");
  const engineStatus = document.getElementById("engineStatus");

  DEFECTS.forEach(d => {
    refFeaturesMap[d.id] = [];
    const opt = document.createElement("option");
    opt.value = d.id;
    opt.textContent = d.name;
    defectSelect.appendChild(opt);
  });
  defectSelect.value = "su_izi";

  defectSelect.addEventListener("change", () => {
    const found = DEFECTS.find(d => d.id === defectSelect.value);
    guideText.textContent = found ? found.guide : "";
  });

  function updateDropdownLabels() {
    Array.from(defectSelect.options).forEach(opt => {
      const d = DEFECTS.find(item => item.id === opt.value);
      const count = refFeaturesMap[d.id] ? refFeaturesMap[d.id].length : 0;
      opt.textContent = `${d.name} [${count} Örnek]`;
    });
  }

  function renderBars(scoresMap) {
    barsContainer.innerHTML = "";
    const sorted = [...DEFECTS].sort((a, b) => (scoresMap[b.id] || 0) - (scoresMap[a.id] || 0));
    sorted.forEach((d, idx) => {
      const val = scoresMap[d.id] || 0;
      const count = refFeaturesMap[d.id] ? refFeaturesMap[d.id].length : 0;
      const row = document.createElement("div");
      row.className = "bar-row";
      row.innerHTML = `
        <div class="bar-label">
          <span>${d.name} <small style="color:var(--muted)">(${count} örnek)</small></span>
          <strong>%${val.toFixed(1)}</strong>
        </div>
        <div class="bar-bg">
          <div class="bar-fill ${idx === 0 && val > 0 ? "winner" : ""}" style="width: ${val}%"></div>
        </div>
      `;
      barsContainer.appendChild(row);
    });
  }
  renderBars({});

  function extractSignature(imgEl) {
    const size = 128;
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(imgEl, 0, 0, size, size);
    const data = ctx.getImageData(0, 0, size, size).data;

    const gray = new Float32Array(size * size);
    let minVal = 255, maxVal = 0;

    for (let i = 0; i < size * size; i++) {
      const g = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
      gray[i] = g;
      if (g < minVal) minVal = g;
      if (g > maxVal) maxVal = g;
    }

    const range = Math.max(1, maxVal - minVal);
    for (let i = 0; i < gray.length; i++) {
      gray[i] = ((gray[i] - minVal) / range) * 255;
    }

    const hist = new Float32Array(16);
    for (let i = 0; i < gray.length; i++) {
      const bin = Math.min(15, Math.floor(gray[i] / 16));
      hist[bin]++;
    }
    for (let i = 0; i < 16; i++) hist[i] /= gray.length;

    let gxTotal = 0, gyTotal = 0;
    const grid = new Float32Array(64);
    for (let y = 1; y < size - 1; y++) {
      for (let x = 1; x < size - 1; x++) {
        const idx = y * size + x;
        const gx = Math.abs(gray[idx + 1] - gray[idx - 1]);
        const gy = Math.abs(gray[idx + size] - gray[idx - size]);
        gxTotal += gx;
        gyTotal += gy;
        const cell = Math.floor(y / 16) * 8 + Math.floor(x / 16);
        grid[cell] += (gx + gy) / 510;
      }
    }
    for (let i = 0; i < 64; i++) grid[i] /= 256;
    const edgeRatio = gxTotal / Math.max(1, gxTotal + gyTotal);
    const edgeDensity = (gxTotal + gyTotal) / (size * size * 255);

    return { hist, grid, edgeRatio, edgeDensity };
  }

  function compareSignatures(a, b) {
    let histDist = 0;
    for (let i = 0; i < 16; i++) histDist += Math.abs(a.hist[i] - b.hist[i]);

    let gridDist = 0;
    for (let i = 0; i < 64; i++) gridDist += Math.abs(a.grid[i] - b.grid[i]);
    gridDist /= 64;

    const dirDist = Math.abs(a.edgeRatio - b.edgeRatio);
    const densDist = Math.abs(a.edgeDensity - b.edgeDensity);

    const totalDist = histDist * 0.35 + gridDist * 1.4 + dirDist * 0.9 + densDist * 0.8;
    const similarity = Math.max(0.01, 1 / (1 + totalDist * 4));
    return Math.pow(similarity, 3);
  }

  function loadImageSingle(url, useCors) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      if (useCors) img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Yüklenemedi"));
      img.src = url;
    });
  }

  async function tryLoadRefImage(fileName) {
    try {
      return await loadImageSingle("./" + fileName, false);
    } catch (e1) {
      return await loadImageSingle("https://raw.githubusercontent.com/hsynckm/tissue-kalite/main/" + fileName, true);
    }
  }

  async function loadGuideTexts() {
    let txtCount = 0;
    for (const d of DEFECTS) {
      for (const fname of d.txtFiles) {
        const urls = [
          "./" + encodeURIComponent(fname) + "?v=" + Date.now(),
          "https://raw.githubusercontent.com/hsynckm/tissue-kalite/main/" + encodeURIComponent(fname)
        ];
        let loaded = false;
        for (const u of urls) {
          try {
            const resp = await fetch(u);
            if (resp.ok) {
              const text = await resp.text();
              if (text && text.trim().length > 0) {
                d.guide = text.trim();
                txtCount++;
                loaded = true;
                break;
              }
            }
          } catch (e) {}
        }
        if (loaded) break;
      }
    }
    const current = DEFECTS.find(d => d.id === defectSelect.value);
    guideText.textContent = current ? current.guide : "";
    return txtCount;
  }

  async function initSystem() {
    let totalImages = 0;

    // Tüm sorunlar için hem ana dosyayı hem de _2.jpg ... _10.jpg ek örneklerini paralel tara
    const tasks = [];
    for (const d of DEFECTS) {
      refFeaturesMap[d.id] = [];
      const candidates = [...d.baseFiles];
      for (let n = 2; n <= 10; n++) {
        candidates.push(`${d.prefix}_${n}.jpg`);
      }

      for (const fname of candidates) {
        tasks.push(
          tryLoadRefImage(fname)
            .then(img => {
              refFeaturesMap[d.id].push(extractSignature(img));
              totalImages++;
            })
            .catch(() => {}) // Yüklenmemiş ek numaraları sessizce atla
        );
      }
    }

    await Promise.all(tasks);
    const txtCount = await loadGuideTexts();

    updateDropdownLabels();
    renderBars({});

    if (totalImages > 0) {
      engineStatus.textContent = `Sistem Hazır (${totalImages} Örnek Fotoğraf, ${txtCount}/6 Rehber Yüklendi)`;
      engineStatus.classList.add("ready");
    } else {
      engineStatus.textContent = "Uyarı: Referans resimleri yüklenemedi, dosya yolunu kontrol edin.";
    }
  }

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      previewImg.onload = () => {
        previewImg.style.display = "block";
        imageReady = true;
        topResult.textContent = "Fotoğraf yüklendi. 'Analiz Et' butonuna basın.";
      };
      previewImg.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  clearBtn.addEventListener("click", () => {
    fileInput.value = "";
    previewImg.removeAttribute("src");
    previewImg.style.display = "none";
    imageReady = false;
    topResult.textContent = "Henüz analiz yapılmadı.";
    renderBars({});
  });

  analyzeBtn.addEventListener("click", async () => {
    if (!imageReady) {
      topResult.textContent = "Lütfen önce sol taraftan bir fotoğraf seçin.";
      return;
    }

    const loadedTotal = Object.values(refFeaturesMap).reduce((acc, arr) => acc + arr.length, 0);
    if (loadedTotal === 0) {
      await initSystem();
    }

    const testSig = extractSignature(previewImg);
    const rawScores = {};
    let totalScore = 0;

    // Her sorun kategorisindeki tüm örnekler içinde EN YÜKSEK benzerliği alan örneğin puanını baz al
    for (const d of DEFECTS) {
      const sigList = refFeaturesMap[d.id] || [];
      if (sigList.length === 0) {
        rawScores[d.id] = 0;
        continue;
      }
      let bestScore = 0;
      for (const refSig of sigList) {
        const s = compareSignatures(refSig, testSig);
        if (s > bestScore) bestScore = s;
      }
      rawScores[d.id] = bestScore;
      totalScore += bestScore;
    }

    if (totalScore === 0) {
      topResult.textContent = "Hata: Referans fotoğraflara erişilemedi.";
      return;
    }

    const percentages = {};
    let winner = DEFECTS[0];
    let maxPct = -1;

    for (const d of DEFECTS) {
      const pct = (rawScores[d.id] / totalScore) * 100;
      percentages[d.id] = pct;
      if (pct > maxPct) {
        maxPct = pct;
        winner = d;
      }
    }

    topResult.textContent = `TESPİT EDİLEN SORUN: ${winner.name} (%${maxPct.toFixed(1)})`;
    renderBars(percentages);
    defectSelect.value = winner.id;
    guideText.textContent = winner.guide;
  });

  window.addEventListener("DOMContentLoaded", initSystem);
</script>
</body>
</html>
